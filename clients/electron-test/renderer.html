<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hermes Satellite Test</title>
    <style>
      body { font: 14px system-ui; margin: 20px; }
      button { font-size: 15px; padding: 8px 14px; margin: 4px 0; }
      #ptt { width: 100%; height: 72px; font-size: 18px; }
      .row { margin: 8px 0; }
      #state { font-weight: 600; }
      #lat { font-variant-numeric: tabular-nums; }
      .log { white-space: pre-wrap; background: #f4f4f4; padding: 8px;
             height: 160px; overflow: auto; font: 12px ui-monospace; }
      input { width: 130px; }
    </style>
  </head>
  <body>
    <h3>Hermes Satellite — live test (feature 003)</h3>
    <div class="row">
      mgmt <input id="mgmt" value="http://192.168.4.140:8643" />
      webrtc <input id="webrtc" value="http://192.168.4.140:8644" />
      ws <input id="ws" value="ws://192.168.4.140:8643/satellite/ws" />
    </div>
    <div class="row">
      <button id="connect">Connect</button>
      state: <span id="state">idle</span> ·
      end-of-speech→reply: <span id="lat">—</span> ms
    </div>
    <button id="ptt" disabled>Push & hold to talk</button>
    <button id="stats">stats (inbound audio)</button>
    <div class="row">transcript: <span id="tx">—</span></div>
    <div class="row">reply: <span id="rep">—</span></div>
    <div class="log" id="log"></div>
    <!-- Hidden playback in the SAME renderer so Chromium AEC3 has the
         render reference (design satellite #3, browser_aec3). -->
    <audio id="far" autoplay></audio>
    <script src="renderer.js"></script>
  </body>
</html>
