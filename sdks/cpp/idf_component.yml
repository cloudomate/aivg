# ESP-IDF component manifest for the ESP32-S3 tier (feature 020, US2).
# Built with `idf.py` against ESP-IDF v5.x — NOT via the root CMake build.
# Device-side firmware that consumes this component lives in the
# cloudomate/aivg-devices repo (see sdks/cpp/HANDOFF.md).
version: "0.1.0"
description: "libaivg-sat — C++ WebRTC satellite-client SDK (ESP32-S3 tier)"
url: "https://github.com/cloudomate/aivg"
dependencies:
  idf: ">=5.0"
  # WebRTC transport (MIT). The registry releases (0.0.2/0.0.3) predate the
  # current API the SDK targets, so the consuming firmware vendors libpeer
  # *master* locally (+ the offerer→DTLS-client patch) as a component named
  # `libpeer` — see aivg-devices/devices/respeaker-xvf3800-esp32s3. We therefore
  # do NOT declare sepfy/libpeer here; the SDK only PRIV_REQUIRES `libpeer`.
  # esp-adf-libs WebRTC is explicitly NOT used (product-locked license).
  espressif/esp_websocket_client: "*"   # control-plane WS (Principle III)
  # nlohmann/json: vendored single header at third_party/nlohmann/json.hpp
  # (no maintained IDF-registry component); added to the ESP component includes.
  # mbedtls / libsrtp / opus arrive transitively via libpeer + IDF built-ins.
