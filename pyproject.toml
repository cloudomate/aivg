[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivg"
version = "0.2.2"
description = "AIVG — AI Voice Gateway: agent-platform-agnostic voice-satellite management plane + CLI"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Cloudomate", email = "hello@cloudomate.com"},
]
maintainers = [
    {name = "Cloudomate / AIVG contributors"},
]
keywords = ["voice", "satellite", "webrtc", "hermes", "aivg", "ai", "agent", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiortc>=1.6",
    "aiohttp>=3.9",
    "aiohttp-sse>=2.2",
    "av>=11",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    # Feature 013 — `aivg setup` parses + mutates Hermes's config.yaml
    # (to add the `satellite:` block + register `aivg-satellite` in
    # `plugins.enabled`). PyYAML is the de-facto choice and is already
    # pulled in transitively by aiortc + Hermes itself, but pinning here
    # so a standalone `pip install aivg` is self-sufficient.
    "PyYAML>=6",
    # Feature 017 — the ESPHome Voice Assistant transport reuses the
    # upstream proto-generated message types (``aioesphomeapi.api_pb2``)
    # and the varint framing helpers (``aioesphomeapi.core``) so AIVG
    # never invents an ESPHome wire format. Pinned to the range that
    # currently ships with Home Assistant + ESPHome 2024.x firmware.
    "aioesphomeapi>=45,<46",
    # Feature 017 (post-MVP, client-mode noise encryption). ESPHome
    # 2026.1+ removed the plaintext API password; modern firmware
    # speaks Noise_NNpsk0_25519_ChaChaPoly_SHA256 exclusively. These
    # are aioesphomeapi's own crypto deps, surfaced here so AIVG can
    # depend on them directly for the client-mode dialer's noise
    # handshake path.
    "noiseprotocol>=0.3,<0.4",
    "chacha20poly1305-reuseable>=0.13,<0.14",
    # Feature 021 — gRPC satellite transport. Async server (`grpc.aio`)
    # hosting the `aivg.satellite.v1.Audio` (and Phase-2 `Management`)
    # services. NOTE: contrary to the 021 proposal, grpcio is NOT already
    # transitively present (aioesphomeapi pulls protobuf, not grpcio), so
    # it is pinned here as a first-class runtime dependency. `protobuf`
    # backs the checked-in generated stubs; `grpcio-tools` (codegen only)
    # lives under the `dev` extra.
    "grpcio>=1.60",
    "grpcio-reflection>=1.60",  # server reflection for grpcurl diagnosability (FR-013)
    "protobuf>=4",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24",
    "httpx>=0.27",
    # Feature 021 — protobuf/gRPC codegen for `scripts/gen_proto.sh`.
    # Build/dev-time only; generated stubs are checked into the tree so
    # `pip install aivg` needs no protoc toolchain.
    "grpcio-tools>=1.60",
]

[project.urls]
Repository = "https://github.com/cloudomate/aivg"
Issues = "https://github.com/cloudomate/aivg/issues"
Changelog = "https://github.com/cloudomate/aivg/blob/main/CHANGELOG.md"
Documentation = "https://github.com/cloudomate/aivg/blob/main/README.md"

[project.scripts]
aivg = "aivg_cli.cli:app"
# (Legacy `sat-cli` alias was removed in feature 012 Phase 9 / T048.
# The compat-shim window closed with the shim deletion.)

# Feature 013 — Hermes-native plugin distribution. When this package is
# `pip install`'d into a Hermes venv, the gateway's plugin loader picks
# up this entry point (group `hermes_agent.plugins`) and calls
# `register(ctx)` on the module below. See:
#   - Hermes plugin guide §"Distribute via pip"
#   - Hermes loader: `hermes_cli/plugins.py` (ENTRY_POINTS_GROUP)
# The entry-point name (`aivg-satellite`) is what `hermes plugins list`
# shows under source=entrypoint.
[project.entry-points."hermes_agent.plugins"]
aivg-satellite = "aivg_core.platforms.hermes.plugin_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aivg_core*", "aivg_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# (Compat-shim DeprecationWarning filters removed in feature 012
# Phase 9 — the shims they silenced no longer exist.)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
