[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivg-core"
version = "0.3.0"
description = "AIVG — AI Voice Gateway: agent-platform-agnostic voice-satellite management plane + CLI; Hermes is the v1 plugin (constitution v2.0.1)"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.6",
    "aiohttp>=3.9",
    "aiohttp-sse>=2.2",
    "av>=11",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24",
    "httpx>=0.27",
]

[project.scripts]
aivg = "aivg_cli.cli:app"
# (Legacy `sat-cli` alias was removed in feature 012 Phase 9 / T048.
# The compat-shim window closed with the shim deletion.)

[tool.setuptools.packages.find]
where = ["src"]
include = ["aivg_core*", "aivg_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# (Compat-shim DeprecationWarning filters removed in feature 012
# Phase 9 — the shims they silenced no longer exist.)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
